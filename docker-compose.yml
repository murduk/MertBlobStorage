services:
  mertblobstorage:
    build: .
    image: mertblobstorage:latest
    ports:
      - "8443:8443"
    volumes:
      - mbs-data:/app/data
      # Mount your own config to persist real accounts across container
      # recreation instead of relying on the auto-generated dev account:
      # - ./config/my-config.toml:/app/config/default.toml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8443/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s

volumes:
  mbs-data:
